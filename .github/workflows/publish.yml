name: Publish doc2toon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm pack --dry-run
      # Authentication is OIDC trusted publishing (configured on npmjs.com for
      # this repo + workflow). No token secret is involved; id-token: write
      # above is what grants the OIDC exchange.
      - run: npm publish --provenance --access public
